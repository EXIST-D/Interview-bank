<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Interview Bank · 登录</title>
  <link rel="stylesheet" href="app.css">
  <script src="login.js" defer></script>
</head>
<body class="login-page">
<main class="login-shell">
  <form id="login-form" class="login-card" novalidate>
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">iB</span>
      <span>Interview Bank<small data-login="tagline">每一次积累，都算数。</small></span>
    </div>
    <h1 data-login="title">登录你的题库</h1>
    <p class="login-lead" data-login="lead">题目、参考答案和练习进度，只对你本人可见。</p>
    <label class="login-field">
      <span data-login="username">用户名</span>
      <input id="login-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label class="login-field">
      <span data-login="password">密码</span>
      <span class="login-password">
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-reveal" class="login-reveal" type="button" data-login="show" aria-pressed="false">显示</button>
      </span>
    </label>
    <p id="login-error" class="login-error" role="alert" hidden></p>
    <button id="login-submit" class="button primary login-submit" type="submit" data-login="submit">登录</button>
    <p class="login-foot"><span class="status-dot" aria-hidden="true"></span><span data-login="foot">HTTPS 加密连接 · 连续输错会暂时锁定</span></p>
  </form>
  <a class="login-repo repo-link" href="https://github.com/EXIST-D/Interview-bank" target="_blank" rel="noopener noreferrer"><svg class="github-mark" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg><span data-login="repo">开源项目 · 在 GitHub 上查看</span><span aria-hidden="true">↗</span></a>
</main>
</body>
</html>
