name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, regression and smoke tests (standard library only)
        run: python -B -X utf8 -m unittest discover -s tests -v
      - name: Installed skill stays read-only
        shell: bash
        run: |
          test -z "$(find skills -name __pycache__ -print -quit)"
          test -z "$(git status --porcelain -- skills)"

  lint:
    name: lint (pyflakes rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.10
      - name: Unused imports, undefined names, unused variables
        run: ruff check --select F --target-version py310 skills tests tools evals

  web:
    name: web reader (typecheck, rebuild, committed bundle matches, browser checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: The skill ships exactly what web/ builds
        run: git diff --exit-code --stat -- ../skills/interview-bank/assets/web && test -z "$(git status --porcelain -- ../skills/interview-bank/assets/web)"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Notes, favourites, outline, practice and sync in a real browser (demo bank, hosted mode)
        run: pnpm e2e

  legacy-runs:
    name: test (full-snapshot run format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Whole suite with INTERVIEW_BANK_RUN_FORMAT=1
        env:
          INTERVIEW_BANK_RUN_FORMAT: "1"
        run: python -B -X utf8 -m unittest discover -s tests

  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the installable Skill ZIP
        run: python -B -X utf8 tools/package_skill.py
      - name: Install from the ZIP and exercise every subsystem read-only
        run: python -B -X utf8 tools/check_release.py
