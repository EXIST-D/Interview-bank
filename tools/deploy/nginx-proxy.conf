# Shared proxy settings, installed as snippets/interview-bank-proxy.conf. Replace TOKEN as above.
# Each location sets its own client_max_body_size: nginx refuses the directive twice in one location.
proxy_http_version 1.1;
proxy_set_header X-Interview-Token "TOKEN";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Prefix /ibank;
proxy_read_timeout 30s;
add_header X-Robots-Tag "noindex, nofollow" always;
