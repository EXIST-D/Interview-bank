# Optional, http context (e.g. /etc/nginx/conf.d/interview-bank-gzip.conf): compress the reader's scripts,
# styles and JSON. The page's assets shrink from about 550 KB to about 170 KB; the notes catalogue compresses well too.
gzip_types text/css text/javascript application/javascript application/json;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
