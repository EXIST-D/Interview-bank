# Include inside your HTTPS server block: include snippets/interview-bank.conf;
# The reader shows its own login page; the proxy adds the token it expects and names the real client.
# Replace TOKEN with the content of /etc/interview-bank/token (keep this file root-only: chmod 600).
# Needs the zone from nginx-ratelimit.conf (http context, e.g. /etc/nginx/conf.d/).
location = /ibank { return 301 /ibank/; }
location = /ibank/api/login {
    limit_req zone=ibank_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8765/api/login;
    include snippets/interview-bank-proxy.conf;
}
location /ibank/ {
    proxy_pass http://127.0.0.1:8765/;
    include snippets/interview-bank-proxy.conf;
}
