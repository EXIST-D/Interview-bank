# Include inside your HTTPS server block: include snippets/interview-bank.conf;
# The proxy asks for a password, then adds the token the Web reader expects. Replace TOKEN with the content of
# /etc/interview-bank/token (keep this file root-only: chmod 600).
location = /ibank { return 301 /ibank/; }
location /ibank/ {
    auth_basic "Interview Bank";
    auth_basic_user_file /etc/nginx/interview-bank.htpasswd;
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header X-Interview-Token "TOKEN";
    proxy_read_timeout 30s;
    client_max_body_size 64k;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
}
